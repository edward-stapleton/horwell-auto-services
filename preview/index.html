<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Horwell Auto Services | Website preview</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121933" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="archivo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Archivo";
      src: url("archivo-latin-wght-normal.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    :root {
      --navy: #1c2a5e;
      --bg: #f4f5f8;
      --surface: #ffffff;
      --ink: #141a2e;
      --muted: #4a5168;
      --line: #dfe2ea;
      --field: #ffffff;
      --btn-bg: var(--navy);
      --btn-bg-hover: #26387a;
      --btn-ink: #ffffff;
      --error: #a12a1c;
      --focus: #2f6fd6;
      --shadow: 0 1px 2px rgb(28 42 94 / 0.06), 0 12px 32px rgb(28 42 94 / 0.08);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121933;
        --surface: #182143;
        --ink: #e8ebf5;
        --muted: #aeb5cc;
        --line: #2f3b6b;
        --field: #121933;
        --btn-bg: #e8ecf7;
        --btn-bg-hover: #ffffff;
        --btn-ink: var(--navy);
        --error: #ffb4a6;
        --focus: #8fb4ff;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.2), 0 12px 32px rgb(0 0 0 / 0.25);
        color-scheme: dark;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(1.5rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      background: var(--bg);
      color: var(--ink);
      font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.5;
    }
    .gate {
      width: min(100%, 26rem);
      padding: clamp(1.5rem, 5vw, 2.5rem);
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      text-align: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .gate.leaving { opacity: 0; transform: translateY(-8px); }
    .gate__logo { display: block; width: min(100%, 15rem); height: auto; margin: 0 auto 1.75rem; }
    h1 { margin: 0 0 0.5rem; font-size: 1.375rem; font-weight: 750; letter-spacing: -0.01em; color: var(--ink); }
    .gate__intro { margin: 0 0 1.5rem; color: var(--muted); text-wrap: pretty; }
    form { display: grid; gap: 0.75rem; text-align: left; }
    label { font-weight: 650; font-size: 0.9375rem; }
    input {
      width: 100%;
      min-height: 3.25rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: var(--field);
      color: var(--ink);
      font: inherit;
      letter-spacing: 0.04em;
    }
    input[aria-invalid="true"] { border-color: var(--error); }
    button {
      min-height: 3.25rem;
      margin-top: 0.25rem;
      border: 0;
      border-radius: 999px;
      background: var(--btn-bg);
      color: var(--btn-ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }
    button:hover { background: var(--btn-bg-hover); }
    button:active { transform: scale(0.98); }
    button[disabled] { cursor: progress; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .feedback { min-height: 1.5em; margin: 0; font-size: 0.9375rem; color: var(--error); }
    .shake { animation: shake 0.4s; }
    @keyframes shake {
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .gate, button { transition: none; }
      .shake { animation: none; }
    }
  </style>
</head>
<body>
  <main class="gate" id="gate">
    <picture>
      <source srcset="logo-dark.svg" media="(prefers-color-scheme: dark)">
      <img class="gate__logo" src="logo.svg" alt="Horwell Auto Services" width="344" height="160">
    </picture>
    <h1>Website preview</h1>
    <p class="gate__intro">Enter the password to see the new Horwell Auto Services website.</p>
    <form id="unlock" novalidate>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="characters" spellcheck="false" required aria-describedby="feedback">
      <button type="submit">View website</button>
      <p class="feedback" id="feedback" aria-live="polite"></p>
    </form>
  </main>

  <script>
    // Web Crypto only works on secure pages.
    if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      location.replace('https:' + location.href.slice(5));
    }
  </script>
  <script>
    (function () {
      var form = document.getElementById('unlock');
      var input = document.getElementById('password');
      var button = form.querySelector('button');
      var feedback = document.getElementById('feedback');
      var gate = document.getElementById('gate');
      var STORE_KEY = 'horwell-preview-pw';

      function fromB64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

      var bundle;
      async function loadBundle() {
        if (!bundle) {
          var res = await fetch('site.enc.json', { cache: 'no-cache' });
          if (!res.ok) throw new Error('load');
          bundle = await res.json();
        }
        return bundle;
      }

      // Resolves to the site HTML, or rejects with Error('password') / Error('load').
      async function decrypt(password) {
        var b = await loadBundle();
        var baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
        var key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(b.salt), iterations: b.iterations },
          baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
        try {
          var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(b.iv) }, key, fromB64(b.data));
          return new TextDecoder().decode(plain);
        } catch (e) {
          throw new Error('password');
        }
      }

      // Swap this page for the decrypted site. Its scripts run as normal.
      function showSite(html, animate) {
        var swap = function () {
          document.open();
          document.write(html);
          document.close();
          window.scrollTo(0, 0);
        };
        if (animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          gate.classList.add('leaving');
          setTimeout(swap, 300);
        } else {
          swap();
        }
      }

      function fail(message) {
        feedback.textContent = message;
        input.setAttribute('aria-invalid', 'true');
        gate.classList.remove('shake');
        void gate.offsetWidth;
        gate.classList.add('shake');
        input.focus();
        input.select();
      }

      // Passwords are given out in capitals, so accept any case.
      function normalise(pw) { return pw.trim().toUpperCase(); }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var password = normalise(input.value);
        if (!password) { fail('Enter the password to continue.'); return; }
        if (!window.crypto || !crypto.subtle) {
          fail('This browser can’t open the preview. Try an up-to-date browser.');
          return;
        }
        button.disabled = true;
        button.textContent = 'Checking…';
        feedback.textContent = '';
        input.removeAttribute('aria-invalid');
        try {
          var html = await decrypt(password);
          try { localStorage.setItem(STORE_KEY, password); } catch (err) {}
          showSite(html, true);
        } catch (err) {
          fail(err.message === 'password'
            ? 'That password isn’t right. Check it and try again.'
            : 'Couldn’t load the preview. Check your connection and try again.');
        } finally {
          button.disabled = false;
          button.textContent = 'View website';
        }
      });

      input.addEventListener('input', function () {
        if (input.hasAttribute('aria-invalid')) {
          input.removeAttribute('aria-invalid');
          feedback.textContent = '';
        }
      });

      // Remember the password on this device so Ian and Mick only type it once.
      var saved = null;
      try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
      if (saved && window.crypto && crypto.subtle) {
        decrypt(saved).then(function (html) { showSite(html, false); }).catch(function () {
          try { localStorage.removeItem(STORE_KEY); } catch (e) {}
        });
      }
    })();
  </script>
</body>
</html>
